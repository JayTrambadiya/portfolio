name = "jay-portfolio"

# Cloudflare Pages Functions run on the Workers runtime. Node.js APIs require nodejs_compat.
# Keep this date current; Cloudflare recommends 2024-09-23 or later for nodejs_compat.
compatibility_date = "2026-03-11"
compatibility_flags = ["nodejs_compat"]

# When using `@cloudflare/next-on-pages`, static output is written here.
pages_build_output_dir = ".vercel/output/static"

